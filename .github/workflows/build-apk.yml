name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare project files
        run: |
          mkdir -p www
          cp index.html www/
          cat > package.json <<'JSON'
          {
            "name": "door-butik",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/android": "^6.2.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.doorbutik.app",
            "appName": "Door Butik",
            "webDir": "www",
            "server": { "url": "https://filtara9811.github.io/door-butik/", "androidScheme": "https" }
          }
          JSON

      - name: Install Capacitor
        run: npm install

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: door-butik-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Door Butik APK #${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
