name: Build APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'icon.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare project files
        run: |
          mkdir -p www
          cp index.html www/
          cat > package.json <<'JSON'
          {
            "name": "door-butik",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/android": "^6.2.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.doorbutik.app",
            "appName": "Door Butik",
            "webDir": "www",
            "server": { "url": "https://filtara9811.github.io/door-butik/", "androidScheme": "https" }
          }
          JSON

      - name: Install Capacitor
        run: npm install

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: App icon
        run: |
          pip install pillow
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          src = Image.open('icon.png').convert('RGBA')
          for k, v in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              d = 'android/app/src/main/res/mipmap-' + k
              os.makedirs(d, exist_ok=True)
              im = src.resize((v, v), Image.LANCZOS)
              im.save(d + '/ic_launcher.png')
              im.save(d + '/ic_launcher_foreground.png')
              m = Image.new('L', (v * 4, v * 4), 0)
              ImageDraw.Draw(m).ellipse([0, 0, v * 4 - 1, v * 4 - 1], fill=255)
              r = im.copy()
              r.putalpha(m.resize((v, v), Image.LANCZOS))
              r.save(d + '/ic_launcher_round.png')
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: door-butik-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Door Butik APK #${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
