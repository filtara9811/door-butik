name: Build APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'icon.png'
      - 'android-src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare project files
        run: |
          mkdir -p www
          cp docs/index.html www/
          cat > package.json <<'JSON'
          {
            "name": "door-butik",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/android": "^6.2.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.doorbutik.app",
            "appName": "Door Butik",
            "webDir": "www",
            "server": { "url": "https://filtara9811.github.io/door-butik/", "androidScheme": "https" }
          }
          JSON

      - name: Install Capacitor
        run: |
          npm install

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Aira native (offline Hindi voice + floating bubble)
        run: |
          PKG=android/app/src/main/java/com/doorbutik/app
          mkdir -p $PKG
          cp android-src/*.java $PKG/
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ''.join('    <uses-permission android:name="%s" />\n' % x for x in [
              'android.permission.RECORD_AUDIO',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MICROPHONE',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SYSTEM_ALERT_WINDOW'])
          s = s.replace('</manifest>', perms + '</manifest>', 1)
          svc = '    <service android:name=".AiraService" android:exported="false" android:foregroundServiceType="microphone" />\n'
          s = s.replace('</application>', svc + '</application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          g = 'android/app/build.gradle'
          t = open(g, encoding='utf-8').read()
          t = t.replace('dependencies {', 'dependencies {\n    implementation "net.java.dev.jna:jna:5.13.0@aar"\n    implementation "com.alphacephei:vosk-android:0.3.47"', 1)
          open(g, 'w', encoding='utf-8').write(t)
          PY
          mkdir -p android/app/src/main/assets
          curl -fL --retry 4 --retry-delay 5 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q model.zip
          mv vosk-model-small-hi-0.22 android/app/src/main/assets/model-hi
          ls android/app/src/main/assets/model-hi
          du -sh android/app/src/main/assets/model-hi

      - name: App icon
        run: |
          pip install pillow
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          src = Image.open('icon.png').convert('RGBA')
          for k, v in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              d = 'android/app/src/main/res/mipmap-' + k
              os.makedirs(d, exist_ok=True)
              im = src.resize((v, v), Image.LANCZOS)
              im.save(d + '/ic_launcher.png')
              im.save(d + '/ic_launcher_foreground.png')
              m = Image.new('L', (v * 4, v * 4), 0)
              ImageDraw.Draw(m).ellipse([0, 0, v * 4 - 1, v * 4 - 1], fill=255)
              r = im.copy()
              r.putalpha(m.resize((v, v), Image.LANCZOS))
              r.save(d + '/ic_launcher_round.png')
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: door-butik-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Door Butik APK #${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
